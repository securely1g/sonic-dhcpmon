name: Bazel

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  monitor:
    name: Bazel DHCP monitor (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare native Debian build tools
        run: |
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates curl \
            file git libxml2 patch pkg-config python3 unzip xz-utils zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' }}

      - name: Build, test and check the installed binary and symbols
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash .github/scripts/ci_dhcpmon.sh "$RUNNER_TEMP/dhcpmon-amd64"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhcpmon-amd64
          path: ${{ runner.temp }}/dhcpmon-amd64/
          if-no-files-found: error
